# Projet Xcode décrit en YAML et généré par XcodeGen (`xcodegen generate`).
# Le .xcodeproj n'est donc pas versionné : il se régénère à l'identique, ce qui
# évite les conflits de merge sur project.pbxproj.

name: Leazr
options:
  bundleIdPrefix: co.leazr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Schéma PARTAGÉ (généré dans xcshareddata) : sans lui, Xcode place le schéma
# dans xcuserdata, qui n'est pas versionné — Xcode Cloud ne voit alors aucun
# schéma à compiler et affiche « No results ».
schemes:
  Leazr:
    build:
      targets:
        Leazr: all
    run:
      config: Debug
    archive:
      config: Release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  Leazr:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: Leazr

    dependencies:
      - package: Supabase
        product: Supabase

    info:
      path: Leazr/Resources/Info.plist
      properties:
        CFBundleDisplayName: Leazr
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # iPhone en portrait uniquement, iPad dans les quatre orientations :
        # une app de gestion se tient à une main sur téléphone, mais doit
        # suivre le Smart Keyboard sur tablette.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: >-
          Leazr utilise Face ID pour déverrouiller votre session sans ressaisir
          votre mot de passe.
        NSCameraUsageDescription: >-
          Leazr utilise l'appareil photo pour prendre en photo vos documents
          (pièces d'identité, factures, bons de livraison) et les joindre à un
          dossier.
        NSPhotoLibraryUsageDescription: >-
          Leazr accède à vos photos pour joindre des documents existants à un
          dossier.
        # Sans cette liste, `canOpenURL` répond systématiquement non et aucun
        # softphone n'est proposé pour appeler un client.
        LSApplicationQueriesSchemes:
          - tel
          - facetime-audio
          - sip
          - interfone
          - cloudsoftphone
          - groundwire
          - acrobits
          - zoiper
          - linphone
          - bria
          - tcxcall
          - whatsapp

    settings:
      base:
        # Fiche « Leazr Native », dont Xcode a créé le workflow Xcode Cloud.
        # L'ancienne fiche « Leazr » (co.leazr.app) est un vestige du wrapper
        # Capacitor supprimé ; elle pourra être retirée, et celle-ci renommée.
        PRODUCT_BUNDLE_IDENTIFIER: co.leazr.ios
        PRODUCT_NAME: Leazr
        # 2.0 : rupture assumée avec la lignée 1.8.x du wrapper Capacitor.
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: H2TY9H4DPZ
        # Signature automatique : Xcode crée et renouvelle profils et
        # certificats tout seul. Requiert une session de compte Xcode, donc
        # une compilation lancée depuis la session de l'utilisateur (Xcode ou
        # Terminal), avec -allowProvisioningUpdates en ligne de commande.
        CODE_SIGN_STYLE: Automatic
        # 1 = iPhone, 2 = iPad : une seule app universelle.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
